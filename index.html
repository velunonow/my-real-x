<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Real X</title>
  <meta name="description" content="My own calm collection: only the people and posts I chose. Learn a little, make something.">
  <meta name="theme-color" content="#EEF0EC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Real X">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="wordmark" href="./" data-act="goto" data-view="today">my real <em>x</em></a>
    <button id="sync" class="pill" type="button"></button>
    <button id="gear" class="icon-btn" type="button" aria-label="Settings" data-act="goto" data-view="settings"></button>
  </header>
  <main id="main"><p class="sub">Loading…</p></main>
  <nav class="tabbar" id="nav" aria-label="Main">
    <button type="button" data-view="today"></button>
    <button type="button" data-view="library"></button>
    <button type="button" id="addBtn" class="add" aria-label="Add something"></button>
    <button type="button" data-view="create"></button>
    <button type="button" data-view="people"></button>
  </nav>
  <dialog id="sheet"><div id="sheetBody" class="sheet-inner"></div></dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
