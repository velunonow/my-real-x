name: Link previews

# When data.json changes, fetch preview images, titles and post text for new
# links, then commit them back. Commits made with GITHUB_TOKEN do not start
# this workflow again, so it cannot loop.
on:
  push:
    paths: [data.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link-previews-${{ github.ref }}
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch previews
        run: node .github/scripts/enrich.mjs
      - name: Commit
        run: |
          if git diff --quiet -- data.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add link previews" -- data.json
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
