name: Link previews

# When data.json changes, fetch preview images, titles and post text for new
# links, then commit them back. Commits made with GITHUB_TOKEN do not start
# this workflow again, so it cannot loop.
on:
  push:
    paths: [data.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link-previews-${{ github.ref }}
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch previews and commit
        # Always work on the newest data.json: the app (or a previous run) may
        # have saved while this run was queued. If a save lands while we work,
        # the push is rejected; start again from the newest copy (up to 4 tries).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            node .github/scripts/enrich.mjs
            if git diff --quiet -- data.json; then echo "No changes"; exit 0; fi
            git commit -q -m "Add link previews" -- data.json
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "Saved"; exit 0; fi
            echo "Someone saved at the same time; retrying ($attempt)"
            sleep $((attempt * 5))
          done
          echo "Could not save after 4 tries"; exit 1
